<h1>Shop</h1><a href="#a">Product A</a>
<div id=bar style="position:fixed;bottom:0;left:0;right:0;background:#222;color:#fff;padding:16px;z-index:50">
We use cookies to improve your experience. <button id=accept>Accept all</button><button id=reject>Reject all</button><button id=manage>Manage preferences</button></div>
