<!doctype html><meta charset=utf-8><title>inner2</title>
<body style="margin:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font:48px monospace">
<div id=t>▶ PLAY</div><video id=v muted playsinline style="display:none"></video>
<script>
// Click 1 fires an ad popup; click 2 starts a real <video> (a canvas stream) whose clock advances.
let clicks = 0, started = false;
document.body.addEventListener('click', () => {
  clicks++;
  if (clicks === 1) { window.open('http://localhost:8766/popunder.html', '_blank'); return; }
  if (started) return;
  started = true;
  const c = document.createElement('canvas'); c.width = 320; c.height = 180;
  const g = c.getContext('2d'); let n = 0;
  setInterval(() => { g.fillStyle = '#' + ((n * 40) % 255).toString(16).padStart(2, '0') + '2020'; g.fillRect(0, 0, 320, 180); n++; }, 50);
  const v = document.getElementById('v'); v.srcObject = c.captureStream(30); v.style.display = 'block';
  document.getElementById('t').style.display = 'none'; v.play();
});
</script>
