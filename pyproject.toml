[project]
name = "jev-remote"
version = "0.1.0"
description = "A LAN-only phone remote for a Jev-controlled living-room browser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git@main",
  "python-dotenv>=1.1,<2",
  "qrcode>=8,<9",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.14,<1",
]

[project.scripts]
jev-remote = "jev_remote.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_remote"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
